name: pbl6-console
services:
  backend:
    build: ./backend
    image: pbl6-console-backend:local
    environment:
      PBL6_DATA_MODE: ${PBL6_DATA_MODE:-demo}
      PBL6_ROBOT_NAME: ${PBL6_ROBOT_NAME:-PBL6-01}
      PBL6_CORS_ORIGINS: ${PBL6_CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]}
      PBL6_SETTINGS_FILE: /app/data/demo-settings.json
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - demo-settings:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: ${VITE_DATA_MODE:-demo}
    image: pbl6-console-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  demo-settings:
