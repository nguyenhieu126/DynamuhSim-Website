<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#22bdee" viewBox="0 0 200 160">
<!-- Perspective Grid lines -->
<g stroke="rgba(6, 182, 212, 0.15)" stroke-width="0.75">
<line x1="10" x2="190" y1="140" y2="140"></line>
<line x1="20" x2="180" y1="150" y2="150"></line>
<line x1="10" x2="60" y1="140" y2="160"></line>
<line x1="100" x2="100" y1="140" y2="160"></line>
<line x1="190" x2="140" y1="140" y2="160"></line>
</g>
<!-- Robot Chassis & Wheels (Isometric Mecanum Robot) -->
<g stroke="#22bdee" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
<!-- Front-Left Wheel -->
<ellipse cx="46" cy="115" rx="10" ry="16" transform="rotate(-15 46 115)"></ellipse>
<line stroke-dasharray="2 2" x1="42" x2="48" y1="104" y2="126"></line>
<line stroke-dasharray="2 2" x1="38" x2="52" y1="110" y2="120"></line>
<!-- Front-Right Wheel -->
<ellipse cx="148" cy="120" rx="11" ry="17" transform="rotate(-10 148 120)"></ellipse>
<line stroke-dasharray="2 2" x1="144" x2="152" y1="108" y2="132"></line>
<line stroke-dasharray="2 2" x1="140" x2="156" y1="115" y2="125"></line>
<!-- Rear Wheels (partial view) -->
<ellipse cx="78" cy="94" opacity="0.6" rx="8" ry="12" transform="rotate(-15 78 94)"></ellipse>
<ellipse cx="166" cy="98" opacity="0.6" rx="8" ry="13" transform="rotate(-10 166 98)"></ellipse>
<!-- Lower Frame Base -->
<path d="M50 110 L140 115 L160 95 L72 90 Z"></path>
<!-- Upper Body Platform -->
<path d="M52 95 L138 100 L155 83 L70 78 Z"></path>
<line x1="50" x2="52" y1="110" y2="95"></line>
<line x1="140" x2="138" y1="115" y2="100"></line>
<line x1="160" x2="155" y1="95" y2="83"></line>
<line x1="72" x2="70" y1="90" y2="78"></line>
<!-- Intermediate Layer -->
<path d="M60 76 L130 80 L145 68 L75 64 Z"></path>
<line stroke-dasharray="2 2" x1="56" x2="60" y1="92" y2="76"></line>
<line stroke-dasharray="2 2" x1="134" x2="130" y1="97" y2="80"></line>
<!-- LiDAR Tower Stand & Puck -->
<line stroke-width="2" x1="102" x2="102" y1="66" y2="52"></line>
<ellipse cx="102" cy="52" fill="rgba(6, 182, 212, 0.2)" rx="14" ry="5"></ellipse>
<ellipse cx="102" cy="46" rx="14" ry="5"></ellipse>
<line x1="88" x2="88" y1="52" y2="46"></line>
<line x1="116" x2="116" y1="52" y2="46"></line>
<!-- Sensor ray scan lines -->
<path d="M78 47 L60 42" opacity="0.5" stroke-dasharray="2 2"></path>
<path d="M124 47 L142 42" opacity="0.5" stroke-dasharray="2 2"></path>
</g>
</svg>