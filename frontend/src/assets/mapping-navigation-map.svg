<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 850 540">
<defs>
<!-- Background grid pattern -->
<pattern height="20" id="grid-pattern" patternUnits="userSpaceOnUse" width="20">
<path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"></path>
</pattern>
<!-- Filter for waypoint glow -->
<filter height="140%" id="goal-glow" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="3"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
</filter>
</defs>
<!-- Grid Background -->
<rect fill="url(#grid-pattern)" height="100%" width="100%"></rect>
<!-- SLAM Explored Free Space (White Polygons) -->
<g fill="#FFFFFF" id="free-space-zone">
<!-- Complex lab layout polygon -->
<polygon points="
                    150,180 200,180 200,140 240,140 240,180 340,180 340,240 
                    380,240 380,180 430,180 430,220 500,220 500,140 560,140 
                    560,280 620,280 620,410 520,410 520,480 400,480 400,430 
                    330,430 330,470 240,470 240,400 170,400 170,330 220,330 
                    220,240 150,240
                  "></polygon>
<!-- Hallway extensions & additional rooms -->
<polygon points="430,220 560,220 560,330 430,330"></polygon>
<polygon points="240,280 390,280 390,390 240,390"></polygon>
<polygon points="390,330 500,330 500,430 390,430"></polygon>
</g>
<!-- Obstacles / Interior Walls (Dark Gray Blocks #424B57) -->
<g fill="#3B4451" id="occupied-walls" stroke="#252D3A" stroke-width="1.5">
<!-- Outer Border Boundaries -->
<polyline fill="none" points="149,180 149,240 219,240 219,330 169,330 169,400 239,400 239,470 330,470 330,430 400,430 400,480 520,480 520,410 620,410 620,280 560,280 560,140 500,140 500,220 430,220 430,180 380,180 380,240 340,240 340,180 240,180 240,140 200,140 200,180 149,180" stroke-linejoin="round" stroke-width="12"></polyline>
<!-- Inner pillars/obstacles -->
<rect height="60" rx="2" width="80" x="220" y="200"></rect>
<rect height="30" rx="2" width="70" x="440" y="300"></rect>
<rect height="28" rx="2" width="28" x="365" y="340"></rect>
<rect height="24" rx="2" width="40" x="290" y="390"></rect>
</g>
<!-- LiDAR Live Point Cloud Detections (Red Dots along obstacles) -->
<g fill="#EF4444" id="lidar-points">
<!-- Around top wall -->
<circle cx="205" cy="173" r="1.5"></circle><circle cx="215" cy="173" r="1.8"></circle><circle cx="225" cy="174" r="1.5"></circle><circle cx="235" cy="172" r="1.6"></circle>
<circle cx="245" cy="173" r="1.7"></circle><circle cx="255" cy="174" r="1.5"></circle><circle cx="270" cy="173" r="1.8"></circle><circle cx="285" cy="174" r="1.5"></circle>
<circle cx="300" cy="173" r="1.6"></circle><circle cx="315" cy="174" r="1.4"></circle><circle cx="330" cy="173" r="1.7"></circle>
<!-- Along interior pillar 1 -->
<circle cx="215" cy="203" r="1.6"></circle><circle cx="215" cy="215" r="1.5"></circle><circle cx="215" cy="230" r="1.8"></circle><circle cx="215" cy="245" r="1.6"></circle>
<circle cx="230" cy="265" r="1.5"></circle><circle cx="250" cy="265" r="1.7"></circle><circle cx="275" cy="265" r="1.6"></circle><circle cx="303" cy="265" r="1.8"></circle>
<circle cx="304" cy="230" r="1.5"></circle><circle cx="304" cy="210" r="1.6"></circle>
<!-- Scattered points in middle aisle -->
<circle cx="300" cy="225" r="1.5"></circle><circle cx="310" cy="228" r="1.4"></circle><circle cx="320" cy="230" r="1.7"></circle>
<!-- Around obstacle 2 -->
<circle cx="435" cy="298" r="1.6"></circle><circle cx="450" cy="296" r="1.8"></circle><circle cx="470" cy="296" r="1.5"></circle><circle cx="490" cy="297" r="1.7"></circle><circle cx="512" cy="297" r="1.6"></circle>
<circle cx="436" cy="312" r="1.5"></circle><circle cx="436" cy="328" r="1.6"></circle>
<circle cx="450" cy="334" r="1.7"></circle><circle cx="475" cy="334" r="1.5"></circle><circle cx="500" cy="334" r="1.8"></circle>
<!-- Around bottom wall border -->
<circle cx="365" cy="405" r="1.6"></circle><circle cx="375" cy="406" r="1.5"></circle><circle cx="385" cy="405" r="1.8"></circle>
<circle cx="410" cy="435" r="1.5"></circle><circle cx="430" cy="436" r="1.7"></circle><circle cx="450" cy="435" r="1.6"></circle><circle cx="475" cy="436" r="1.7"></circle><circle cx="495" cy="435" r="1.5"></circle>
<circle cx="545" cy="370" r="1.6"></circle><circle cx="545" cy="390" r="1.8"></circle><circle cx="545" cy="405" r="1.5"></circle>
<!-- Left nook -->
<circle cx="173" cy="340" r="1.6"></circle><circle cx="173" cy="360" r="1.5"></circle><circle cx="173" cy="380" r="1.7"></circle>
<circle cx="185" cy="403" r="1.6"></circle><circle cx="205" cy="404" r="1.5"></circle><circle cx="225" cy="403" r="1.8"></circle>
</g>
<!-- Navigation Trajectory Paths -->
<!-- 1. Current Trajectory (Solid Green Line with Waypoints) -->
<g id="current-trajectory">
<path d="M250,380 Q290,320 340,285 T400,265" fill="none" stroke="#22C55E" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Waypoint nodes -->
<circle cx="250" cy="380" fill="#22C55E" r="3.5"></circle>
<circle cx="295" cy="316" fill="#22C55E" r="4" stroke="#FFFFFF" stroke-width="1.5"></circle>
<circle cx="342" cy="285" fill="#22C55E" r="4" stroke="#FFFFFF" stroke-width="1.5"></circle>
<circle cx="400" cy="265" fill="#22C55E" r="4.5" stroke="#FFFFFF" stroke-width="2"></circle>
</g>
<!-- 2. Planned Path to Goal (Dashed Blue Line) -->
<path d="M400,265 C450,245 490,230 520,200" fill="none" stroke="#1769E0" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="3"></path>
<!-- Robot Pose Marker (Location: 250, 380) -->
<g id="robot-pose" transform="translate(250, 380)">
<!-- Radar Orientation Sweep Cone -->
<path d="M0,0 L-30,-22 A38,38 0 0,1 22,-30 Z" fill="rgba(23, 105, 224, 0.22)"></path>
<!-- Soft Field Ring -->
<circle cx="0" cy="0" fill="rgba(23, 105, 224, 0.12)" r="28"></circle>
<!-- Directional Arrow Pointer -->
<path d="M0,-14 L10,10 L0,5 L-10,10 Z" fill="#1769E0" stroke="#FFFFFF" stroke-width="1.5"></path>
<!-- Identifier Badge 'R' -->
<g transform="translate(18, -10)">
<rect fill="#FFFFFF" height="18" rx="4" stroke="#1769E0" stroke-width="1.5" width="18" x="0" y="0"></rect>
<text fill="#1769E0" font-size="11" font-weight="bold" text-anchor="middle" x="9" y="13">R</text>
</g>
</g>
<!-- Goal Waypoint Marker (Location: 520, 200) -->
<g id="goal-pose" transform="translate(520, 200)">
<!-- Ripple effect circle -->
<circle cx="0" cy="0" fill="rgba(23, 105, 224, 0.18)" r="16" stroke="#1769E0" stroke-dasharray="3 3" stroke-width="1.5"></circle>
<!-- Blue Pinpoint -->
<circle cx="0" cy="0" fill="#1769E0" r="7" stroke="#FFFFFF" stroke-width="2"></circle>
<!-- Pin icon marker shape -->
<path d="M0,-24 C-6,-24 -10,-20 -10,-14 C-10,-6 0,0 0,0 C0,0 10,-6 10,-14 C10,-20 6,-24 0,-24 Z" fill="#1769E0" stroke="#FFFFFF" stroke-width="1.2"></path>
<circle cx="0" cy="-14" fill="#FFFFFF" r="3.5"></circle>
<!-- Identifier Badge 'G' -->
<g transform="translate(14, -28)">
<rect fill="#FFFFFF" height="18" rx="4" stroke="#1769E0" stroke-width="1.5" width="18" x="0" y="0"></rect>
<text fill="#1769E0" font-size="11" font-weight="bold" text-anchor="middle" x="9" y="13">G</text>
</g>
</g>
</svg>